apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: backend
    spec:
      containers:
        - name: api-gateway
          image: ridezyproject-api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: ridezy-config
            - secretRef:
                name: ridezy-dev-secrets
          env:
            - name: PORT
              value: "4000"
            - name: SERVICE_NAME
              value: api-gateway
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
